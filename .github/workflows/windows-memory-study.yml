name: Windows memory recorder
on:
  pull_request:
    paths:
      - 'experiments/long-session-memory.cjs'
      - 'experiments/process-memory/**'
      - 'tests/windows-process-memory.cjs'
      - 'tests/long-session-*.cjs'
      - '.github/workflows/windows-memory-study.yml'
permissions:
  contents: read
jobs:
  windows-counters:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check sampling protocol and terminal orchestration
        run: node --test tests/long-session-stats.cjs tests/long-session-cli.cjs
      - name: Read Windows process counters and detect exit
        run: node tests/windows-process-memory.cjs
